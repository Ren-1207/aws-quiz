.tag-gray{background:#eee;color:#666}

.inp:focus{border-color:#378ADD}

.link{color:#378ADD;cursor:pointer;text-decoration:underline;font-size:14px}

.review-wrong{border:1px solid #A32D2D;background:#FCEBEB}
.review-hint{background:#f5f5f0;border-radius:8px;padding:.75rem 1rem;font-size:13px;line-height:1.7;border-left:3px solid #378ADD;margin-top:4px}

{id:19,en:{q:"EC2 for 1 year, steady traffic, must stay online. Most cost-effective option?",o:["On-Demand","Reserved Instances","Spot Instances","Spot Fleet"],x:"Reserved Instances offer up to 72% off for 1-year steady workloads.",w:{"A":"On-Demand costs more long-term.","C":"Spot can be interrupted.","D":"Spot Fleet still uses interruptible Spot."}},zh:{q:"EC2 運行 1 年，流量穩定，必須在線。最具成本效益？",o:["隨需","預留執行個體","競價","競價群"],x:"預留執行個體為 1 年穩定工作負載提供高達 72% 折扣。",w:{"A":"長期使用隨需成本更高。","C":"競價可被中斷。","D":"競價群仍使用可中斷的競價。"}},c:[1]},
{id:20,en:{q:"Dedicated network connection from on-premises to AWS?",o:["Direct Connect","VPC peering","AWS VPN","Route 53"],x:"Direct Connect provides a dedicated, private connection bypassing the internet.",w:{"B":"VPC peering connects VPCs, not on-prem.","C":"VPN uses public internet.","D":"Route 53 is DNS."}},zh:{q:"從本地到 AWS 的專用網路連接？",o:["Direct Connect","VPC 對等連接","AWS VPN","Route 53"],x:"Direct Connect 提供繞過網際網路的專用私有連接。",w:{"B":"VPC 對等連接連接 VPC，非本地。","C":"VPN 使用公共網際網路。","D":"Route 53 是 DNS。"}},c:[0]},
{id:21,en:{q:"Physical location of AWS global infrastructure?",o:["DataSync","Region","Connect","Organizations"],x:"An AWS Region is a physical geographic area with multiple Availability Zones.",w:{"A":"DataSync is a data transfer service.","C":"Connect is a contact center.","D":"Organizations manages accounts."}},zh:{q:"AWS 全球基礎設施的實體位置？",o:["DataSync","區域","Connect","Organizations"],x:"AWS 區域是擁有多個可用區的實體地理區域。",w:{"A":"DataSync 是資料傳輸服務。","C":"Connect 是客服中心。","D":"Organizations 管理帳戶。"}},c:[1]},
{id:22,en:{q:"Protect information and assets with risk assessment. Which WAF pillar?",o:["Reliability","Security","Operational excellence","Performance efficiency"],x:"The Security pillar covers protecting information, risk assessment, and threat mitigation.",w:{"A":"Reliability = recovery/availability.","C":"OpEx = running systems effectively.","D":"Perf = efficient resource use."}},zh:{q:"保護資訊和資產並進行風險評估。哪個 WAF 支柱？",o:["可靠性","安全性","卓越營運","效能效率"],x:"安全性支柱涵蓋保護資訊、風險評估和威脅緩解。",w:{"A":"可靠性 = 恢復/可用性。","C":"卓越營運 = 有效運行系統。","D":"效能 = 有效使用資源。"}},c:[1]},
{id:23,en:{q:"Purpose of an internet gateway in a VPC?",o:["Create VPN connection","Allow VPC-internet communication","Impose bandwidth constraints","Load balance traffic"],x:"An internet gateway enables communication between VPC and the internet.",w:{"A":"VPN uses a virtual private gateway.","C":"IGW doesn't impose bandwidth limits.","D":"Load balancing uses ELB."}},zh:{q:"VPC 中網際網路閘道的目的？",o:["建立 VPN 連接","允許 VPC 與網際網路通訊","施加頻寬限制","平衡流量"],x:"網際網路閘道可讓 VPC 與網際網路之間通訊。",w:{"A":"VPN 使用虛擬私有閘道。","C":"IGW 不施加頻寬限制。","D":"負載均衡使用 ELB。"}},c:[1]},
{id:24,en:{q:"Migrating monolith to microservices follows which WAF best practice?",o:["Functional testing in deployment","Automation for changes","Deploy to multiple locations","Loosely coupled dependencies"],x:"Microservices = loose coupling — independent operation, reduced blast radius.",w:{"A":"Testing is OpEx, not microservices.","B":"Automation is OpEx.","C":"Multi-location is reliability."}},zh:{q:"單體應用遷移到微服務遵循哪個 WAF 最佳實踐？",o:["部署中整合功能測試","自動化部署變更","部署到多個位置","實施鬆散耦合"],x:"微服務 = 鬆散耦合——獨立運行，減少故障範圍。",w:{"A":"測試是卓越營運，非微服務。","B":"自動化是卓越營運。","C":"多位置是可靠性。"}},c:[3]},
{id:25,en:{q:"Audit password and access key rotation for compliance?",o:["IAM Access Analyzer","AWS Artifact","IAM credential report","Audit Manager"],x:"IAM credential report lists all users' credential status — ages, rotation dates.",w:{"A":"Access Analyzer finds external sharing.","B":"Artifact provides AWS compliance docs.","D":"Audit Manager automates evidence collection."}},zh:{q:"審計密碼和金鑰輪換以滿足合規？",o:["IAM Access Analyzer","AWS Artifact","IAM 憑證報告","Audit Manager"],x:"IAM 憑證報告列出所有使用者的憑證狀態——年齡、輪換日期。",w:{"A":"Access Analyzer 查找外部共享。","B":"Artifact 提供 AWS 合規文件。","D":"Audit Manager 自動化證據收集。"}},c:[2]},
{id:26,en:{q:"Notification when cost threshold reached? (Choose TWO)",o:["SQS","Budgets","Cost Explorer","CloudWatch","Cost & Usage Report"],x:"Budgets sends alerts on thresholds. CloudWatch creates billing alarms via SNS.",w:{"A":"SQS is a message queue.","C":"Cost Explorer visualizes, no alerts.","E":"CUR exports raw data."},m:1},zh:{q:"達到成本閾值時收到通知？（選兩個）",o:["SQS","Budgets","Cost Explorer","CloudWatch","成本和使用報告"],x:"Budgets 在閾值時發送警報。CloudWatch 透過 SNS 建立計費警報。",w:{"A":"SQS 是訊息佇列。","C":"Cost Explorer 視覺化，無警報。","E":"CUR 匯出原始資料。"},m:1},c:[1,3]},
{id:27,en:{q:"Customer responsibilities under shared model? (Choose TWO)",o:["Configure security groups","Classify company assets","Choose AZs for S3","Patch DynamoDB","Select EC2 for Lambda"],x:"Customers configure security groups and classify their own assets.",w:{"C":"AWS manages S3 AZ redundancy.","D":"AWS patches DynamoDB.","E":"Lambda is serverless."},m:1},zh:{q:"共享責任模型下客戶的責任？（選兩個）",o:["配置安全群組","分類公司資產","選擇 S3 可用區","修補 DynamoDB","選擇 EC2 運行 Lambda"],x:"客戶配置安全群組和分類自己的資產。",w:{"C":"AWS 管理 S3 可用區冗餘。","D":"AWS 修補 DynamoDB。","E":"Lambda 是無伺服器。"},m:1},c:[0,1]},
{id:28,en:{q:"Which are WAF pillars? (Choose TWO)",o:["Availability","Reliability","Scalability","Responsive design","Operational excellence"],x:"WAF pillars: OpEx, Security, Reliability, Perf Efficiency, Cost Optimization, Sustainability.",w:{"A":"Availability is a concept, not a pillar.","C":"Scalability is a feature.","D":"Responsive design is web design."},m:1},zh:{q:"哪些是 WAF 支柱？（選兩個）",o:["可用性","可靠性","可擴展性","響應式設計","卓越營運"],x:"WAF 支柱：卓越營運、安全性、可靠性、效能效率、成本優化、永續性。",w:{"A":"可用性是概念，非支柱。","C":"可擴展性是特性。","D":"響應式設計是網頁設計。"},m:1},c:[1,4]},
{id:29,en:{q:"Send both text and email from distributed apps?",o:["SNS","SES","CloudWatch alerts","SQS"],x:"SNS supports SMS + email to multiple subscribers.",w:{"B":"SES is email only.","C":"CloudWatch uses SNS to notify.","D":"SQS is a message queue."}},zh:{q:"從分散式應用發送簡訊和電子郵件？",o:["SNS","SES","CloudWatch 警報","SQS"],x:"SNS 支援 SMS + 電子郵件給多個訂閱者。",w:{"B":"SES 僅限電子郵件。","C":"CloudWatch 使用 SNS 通知。","D":"SQS 是訊息佇列。"}},c:[0]},
{id:30,en:{q:"Programmatic access via CLI or API requires?",o:["Inspector","Access keys","SSH public keys","KMS keys"],x:"Access keys (key ID + secret) are required for CLI/API access.",w:{"A":"Inspector scans vulnerabilities.","C":"SSH keys are for EC2 login.","D":"KMS keys are for encryption."}},zh:{q:"透過 CLI 或 API 程式化訪問需要？",o:["Inspector","存取金鑰","SSH 公鑰","KMS 金鑰"],x:"存取金鑰（金鑰 ID + 密碼）是 CLI/API 訪問所必需的。",w:{"A":"Inspector 掃描漏洞。","C":"SSH 金鑰用於 EC2 登入。","D":"KMS 金鑰用於加密。"}},c:[1]},
{id:31,en:{q:"Thousands of stateless, fault-tolerant simulations up to 3 hours. Best pricing?",o:["Reserved","Spot","On-Demand","Dedicated"],x:"Spot Instances — up to 90% off, ideal for fault-tolerant batch jobs.",w:{"A":"RI needs commitment for steady work.","C":"On-Demand costs more at scale.","D":"Dedicated is for compliance."}},zh:{q:"數千個無狀態、容錯的模擬，最長 3 小時。最佳定價？",o:["預留","競價","隨需","專用"],x:"競價執行個體——最高 90% 折扣，適合容錯批次作業。",w:{"A":"RI 需要穩定工作的承諾。","C":"大規模隨需成本更高。","D":"專用用於合規。"}},c:[1]},
{id:32,en:{q:"Agility in AWS means? (Choose TWO)",o:["Speed of resource implementation","Speed of Region creation","Ability to experiment quickly","Elimination of wasted capacity","Low entry cost"],x:"Agility = fast provisioning + rapid experimentation.",w:{"B":"Region creation is infrastructure planning.","D":"Wasted capacity = elasticity.","E":"Low cost = economies of scale."},m:1},zh:{q:"AWS 敏捷性是什麼？（選兩個）",o:["實施資源的速度","建立區域的速度","快速實驗的能力","消除浪費的容量","低進入成本"],x:"敏捷性 = 快速佈建 + 快速實驗。",w:{"B":"區域建立是基礎設施規劃。","D":"浪費容量 = 彈性。","E":"低成本 = 規模經濟。"},m:1},c:[0,2]},
{id:33,en:{q:"Block SQL injection attacks?",o:["WAF","Shield","Network ACLs","Security groups"],x:"AWS WAF filters web traffic to block SQL injection and XSS.",w:{"B":"Shield is for DDoS.","C":"NACLs work at network layer.","D":"SGs do IP/port filtering."}},zh:{q:"阻止 SQL 注入攻擊？",o:["WAF","Shield","網路 ACL","安全群組"],x:"AWS WAF 過濾網路流量以阻止 SQL 注入和 XSS。",w:{"B":"Shield 防護 DDoS。","C":"NACL 在網路層操作。","D":"SG 做 IP/埠過濾。"}},c:[0]},
{id:34,en:{q:"Identify S3 bucket or IAM role shared with external entity?",o:["Service Catalog","Systems Manager","IAM Access Analyzer","Organizations"],x:"IAM Access Analyzer identifies resources shared with external entities.",w:{"A":"Service Catalog manages portfolios.","B":"Systems Manager automates ops.","D":"Organizations manages accounts."}},zh:{q:"識別 S3 或 IAM 角色是否與外部實體共享？",o:["Service Catalog","Systems Manager","IAM Access Analyzer","Organizations"],x:"IAM Access Analyzer 識別與外部實體共享的資源。",w:{"A":"Service Catalog 管理組合。","B":"Systems Manager 自動化操作。","D":"Organizations 管理帳戶。"}},c:[2]},
{id:35,en:{q:"Obtain AWS compliance reports before migration?",o:["Contact Compliance team","Download from Artifact","Open Support case","Generate with Macie"],x:"AWS Artifact is a self-service portal for compliance reports (SOC, PCI, ISO).",w:{"A":"No direct compliance team contact needed.","C":"Support case is unnecessary.","D":"Macie protects sensitive data, not reports."}},zh:{q:"遷移前獲取 AWS 合規報告？",o:["聯繫合規團隊","從 Artifact 下載","提交 Support 案例","用 Macie 生成"],x:"AWS Artifact 是合規報告的自助服務門戶（SOC、PCI、ISO）。",w:{"A":"不需聯繫合規團隊。","C":"支援案例不必要。","D":"Macie 保護敏感資料，非報告。"}},c:[1]},
{id:36,en:{q:"After migrating to AWS, which cost is the company's direct responsibility?",o:["Application software licenses","Hardware infrastructure cost","Power for AWS servers","Physical security cost"],x:"Application software licenses remain the customer's responsibility.",w:{"B":"AWS pays for hardware.","C":"AWS pays for power.","D":"AWS handles physical security."}},zh:{q:"遷移到 AWS 後，哪個成本是公司直接負責的？",o:["應用程式軟體授權費用","硬體基礎設施費用","AWS 伺服器電力費用","實體安全費用"],x:"應用程式軟體授權仍是客戶的責任。",w:{"B":"AWS 支付硬體費用。","C":"AWS 支付電力。","D":"AWS 處理實體安全。"}},c:[0]},
{id:37,en:{q:"IAM security best practice?",o:["Use root user access keys","Grant broad permissions","Enable MFA","Avoid rotating credentials"],x:"MFA adds essential extra security beyond passwords.",w:{"A":"Never use root access keys.","B":"Use least privilege.","D":"Rotate credentials regularly."}},zh:{q:"IAM 安全最佳實踐？",o:["使用根使用者金鑰","授予廣泛權限","啟用 MFA","避免輪換憑證"],x:"MFA 在密碼之外增加必要的額外安全層。",w:{"A":"不要使用根使用者金鑰。","B":"使用最小權限。","D":"定期輪換憑證。"}},c:[2]},
{id:38,en:{q:"Elasticity in AWS Cloud means? (Choose TWO)",o:["EC2 restart speed","Rightsize resources on demand","Max RAM per EC2","Pay-as-you-go model","Easily procure resources"],x:"Elasticity = scaling resources up/down + easily acquiring resources when needed.",w:{"A":"Restart speed is operational.","C":"Max RAM is hardware spec.","D":"Pay-as-you-go is billing."},m:1},zh:{q:"AWS 雲端彈性是指？（選兩個）",o:["EC2 重啟速度","按需調整資源","每個 EC2 最大 RAM","按使用付費","輕鬆獲取資源"],x:"彈性 = 擴展/縮減資源 + 需要時輕鬆獲取資源。",w:{"A":"重啟速度是操作特性。","C":"最大 RAM 是硬體規格。","D":"按使用付費是計費。"},m:1},c:[1,4]},
{id:39,en:{q:"Audit API calls in AWS accounts?",o:["CloudTrail","Trusted Advisor","Inspector","X-Ray"],x:"CloudTrail records all API calls — Console, SDKs, CLI, services.",w:{"B":"Trusted Advisor gives recommendations.","C":"Inspector scans vulnerabilities.","D":"X-Ray traces app performance."}},zh:{q:"審計 AWS 帳戶中的 API 呼叫？",o:["CloudTrail","Trusted Advisor","Inspector","X-Ray"],x:"CloudTrail 記錄所有 API 呼叫——主控台、SDK、CLI、服務。",w:{"B":"Trusted Advisor 提供建議。","C":"Inspector 掃描漏洞。","D":"X-Ray 追蹤應用效能。"}},c:[0]},
{id:40,en:{q:"Customer responsibility with Lambda?",o:["Managing function code","Confirming hardware","Patching OS","Shutting down unused functions"],x:"Customer writes/deploys code. AWS manages infrastructure, OS, runtime.",w:{"B":"AWS manages hardware.","C":"AWS patches Lambda OS.","D":"Unused Lambda incurs no cost."}},zh:{q:"使用 Lambda 時客戶的責任？",o:["管理函數程式碼","確認硬體","修補 OS","關閉未使用的函數"],x:"客戶編寫/部署程式碼。AWS 管理基礎設施、OS、執行時環境。",w:{"B":"AWS 管理硬體。","C":"AWS 修補 Lambda OS。","D":"未使用的 Lambda 不產生費用。"}},c:[0]},
{id:41,en:{q:"5 TB in S3, occasional queries. Most cost-effective service?",o:["Redshift","Athena","Kinesis","RDS"],x:"Athena — serverless SQL queries on S3, pay per query.",w:{"A":"Redshift needs provisioned clusters.","C":"Kinesis is for streaming.","D":"RDS is for relational databases."}},zh:{q:"S3 中 5 TB 資料，偶爾查詢。最具成本效益的服務？",o:["Redshift","Athena","Kinesis","RDS"],x:"Athena——在 S3 上的無伺服器 SQL 查詢，按查詢付費。",w:{"A":"Redshift 需要佈建叢集。","C":"Kinesis 用於串流。","D":"RDS 用於關聯式資料庫。"}},c:[1]},
{id:42,en:{q:"Which AWS service is free?",o:["SageMaker","Config","Organizations","CloudWatch"],x:"AWS Organizations is free. You only pay for resources in member accounts.",w:{"A":"SageMaker charges for training/hosting.","B":"Config charges per item recorded.","D":"CloudWatch charges beyond free tier."}},zh:{q:"哪個 AWS 服務免費？",o:["SageMaker","Config","Organizations","CloudWatch"],x:"AWS Organizations 免費。只需為成員帳戶中的資源付費。",w:{"A":"SageMaker 對訓練/託管收費。","B":"Config 對每個記錄項目收費。","D":"CloudWatch 超出免費額度收費。"}},c:[2]},
{id:43,en:{q:"CAF people perspective capability?",o:["Data architecture","Event management","Cloud fluency","Strategic partnership"],x:"Cloud fluency — building workforce ability to use cloud effectively.",w:{"A":"Data architecture = Platform.","B":"Event management = Operations.","D":"Strategic partnership = Business."}},zh:{q:"CAF 人員觀點的能力？",o:["資料架構","事件管理","雲端流暢度","策略合作夥伴"],x:"雲端流暢度——建立員工有效使用雲端的能力。",w:{"A":"資料架構 = 平台。","B":"事件管理 = 營運。","D":"策略合作夥伴 = 業務。"}},c:[2]},
{id:44,en:{q:"Upfront commitment for EC2 with lowest cost? (Choose TWO)",o:["Spot","On-Demand","Reserved Instances","Savings Plans","Dedicated Hosts"],x:"RI and Savings Plans both require commitments for significant discounts.",w:{"A":"Spot has no commitment, can be interrupted.","B":"On-Demand is most expensive.","E":"Dedicated Hosts are for licensing."},m:1},zh:{q:"EC2 預先承諾以最低成本？（選兩個）",o:["競價","隨需","預留執行個體","Savings Plans","專用主機"],x:"RI 和 Savings Plans 都需要承諾以獲得顯著折扣。",w:{"A":"競價無承諾，可被中斷。","B":"隨需最貴。","E":"專用主機用於授權。"},m:1},c:[2,3]},
{id:45,en:{q:"Migrate on-prem databases near current location. Which resource to choose RDS area?",o:["Connect","Wavelength","Regions","Direct Connect"],x:"Select the AWS Region closest to your location.",w:{"A":"Connect is a contact center.","B":"Wavelength is for 5G edge.","D":"Direct Connect is networking."}},zh:{q:"將本地資料庫遷移到附近。用哪個資源選擇 RDS 部署區域？",o:["Connect","Wavelength","區域","Direct Connect"],x:"選擇最接近您位置的 AWS 區域。",w:{"A":"Connect 是客服中心。","B":"Wavelength 用於 5G 邊緣。","D":"Direct Connect 是網路。"}},c:[2]},
{id:46,en:{q:"Estimate costs before deployment?",o:["Free Tier","Pricing Calculator","Billing & Cost Management","Cost & Usage Report"],x:"Pricing Calculator creates cost estimates before deploying.",w:{"A":"Free Tier provides free allowances.","C":"Billing tracks actual spending.","D":"CUR exports billing data."}},zh:{q:"部署前估算成本？",o:["免費方案","Pricing Calculator","Billing & Cost Management","成本和使用報告"],x:"Pricing Calculator 在部署前建立成本估算。",w:{"A":"免費方案提供免費額度。","C":"Billing 追蹤實際支出。","D":"CUR 匯出計費資料。"}},c:[1]},
{id:47,en:{q:"Deliver images/videos globally with minimal latency?",o:["CloudFront","S3 cross-region replication","VPN across Regions","PrivateLink"],x:"CloudFront is a CDN caching content at edge locations worldwide.",w:{"B":"Replication copies data but no edge caching.","C":"VPN is secure connectivity.","D":"PrivateLink is private service access."}},zh:{q:"以最低延遲在全球交付圖片和視頻？",o:["CloudFront","S3 跨區域複製","跨區域 VPN","PrivateLink"],x:"CloudFront 是在全球邊緣位置快取內容的 CDN。",w:{"B":"複製複製資料但無邊緣快取。","C":"VPN 是安全連接。","D":"PrivateLink 是私有服務訪問。"}},c:[0]},
{id:48,en:{q:"Economies of scale benefit?",o:["Trade variable for fixed expense","Increased speed and agility","Lower variable costs","Increased operational costs"],x:"AWS's scale = lower variable costs passed to customers.",w:{"A":"Cloud trades fixed FOR variable.","B":"Speed/agility is separate benefit.","D":"Cloud reduces, not increases costs."}},zh:{q:"規模經濟的效益？",o:["將可變換為固定費用","提高速度和敏捷性","較低的可變成本","增加的營運成本"],x:"AWS 的規模 = 較低的可變成本傳遞給客戶。",w:{"A":"雲端將固定換為可變。","B":"速度/敏捷性是獨立效益。","D":"雲端降低而非增加成本。"}},c:[2]},
{id:49,en:{q:"Define cloud resources as code via CloudFormation?",o:["CLI","Developer Center","CDK","CodeStar"],x:"CDK lets you define infrastructure using programming languages, synthesized to CloudFormation.",w:{"A":"CLI is command-line interface.","B":"Developer Center is docs.","D":"CodeStar is CI/CD management."}},zh:{q:"透過 CloudFormation 將雲端資源定義為程式碼？",o:["CLI","Developer Center","CDK","CodeStar"],x:"CDK 讓您使用程式語言定義基礎設施，合成為 CloudFormation。",w:{"A":"CLI 是命令列介面。","B":"Developer Center 是文件。","D":"CodeStar 是 CI/CD 管理。"}},c:[2]},
{id:50,en:{q:"App needs temporary, limited-privilege credentials?",o:["API Gateway","IAM users","STS","IAM instance profiles"],x:"STS issues temporary credentials that auto-expire.",w:{"A":"API Gateway manages endpoints.","B":"IAM users have permanent creds.","D":"Instance profiles use STS under the hood."}},zh:{q:"應用需要臨時、有限權限的憑證？",o:["API Gateway","IAM 使用者","STS","IAM 執行個體設定檔"],x:"STS 簽發自動過期的臨時憑證。",w:{"A":"API Gateway 管理端點。","B":"IAM 使用者有永久憑證。","D":"執行個體設定檔底層使用 STS。"}},c:[2]},
];

const SETS=[{id:1,start:1,end:50,range:"Q1–Q50"}];

// ── APP STATE ─────────────────────────────────────────────────────────────────
let lang="zh",view="login",curUser=null,activeSet=null,curIdx=0;
let ans={},revd={},msel={},userResults={};
let reviewSet=null,modalFn=null;
const t=()=>T[lang];
const K=i=>String.fromCharCode(65+i);
const fmt=iso=>{if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString()+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});};
const getQs=sid=>Q.filter(q=>q.id>=SETS.find(s=>s.id===sid).start&&q.id<=SETS.find(s=>s.id===sid).end);
const uAns=(qid,multi)=>multi?(msel[qid]||[]):(ans[qid]!==undefined?[ans[qid]]:[]);
const aCnt=()=>getQs(activeSet).filter(q=>q.en.m?(msel[q.id]||[]).length>0:ans[q.id]!==undefined).length;

function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}
function $(id){return document.getElementById(id);}
function showV(v){['V-login','V-menu','V-exam','V-result','V-review'].forEach(id=>hide(id));show('V-'+v);view=v;renderHeader();}

// ── HEADER ────────────────────────────────────────────────────────────────────
function renderHeader(){
  const hl=$('hl'),hr=$('hr');
  if(view==='login'){hl.innerHTML=`<span style="font-weight:500;font-size:16px">${t().title}</span>`;hr.innerHTML=`<button class="btn-ghost" style="font-size:12px;padding:4px 12px" onclick="toggleLang()">${t().lang}</button>`;}
  else{
    const backBtn=view!=='menu'?`<button class="btn-ghost" onclick="goMenu()" style="font-size:13px;padding:4px 10px">${t().back}</button>`:'';
    hl.innerHTML=`<div style="display:flex;align-items:center;gap:8px">${backBtn}<span class="txt2" style="font-size:13px">${t().hi}, <strong style="color:#1a1a1a">${curUser}</strong></span></div>`;
    hr.innerHTML=`<button class="btn-ghost" style="font-size:12px;padding:4px 12px" onclick="toggleLang()">${t().lang}</button><button class="btn-ghost btn-danger" style="font-size:12px;padding:4px 12px" onclick="doLogout()">${t().logout}</button>`;
  }
}
function toggleLang(){lang=lang==='zh'?'en':'zh';if(view==='login')renderLogin();else if(view==='menu')renderMenu();else if(view==='exam')renderExam();else if(view==='result')renderResult();else if(view==='review')renderReview();renderHeader();}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function renderLogin(){
  showV('login');
  $('V-login').innerHTML=`<div class="container-sm" style="padding-top:15vh;text-align:center">
    <h1 style="font-size:24px;font-weight:500;margin-bottom:4px">${t().title}</h1>
    <p class="txt2" style="margin-bottom:2rem">${t().subtitle}</p>
    <div class="card" style="text-align:left">
      <div id="login-form">
        <label class="txt2" style="font-size:12px;display:block;margin-bottom:4px">${t().username}</label>
        <input class="inp" id="inp-user" placeholder="${t().username}" onkeydown="if(event.key==='Enter')doLogin()"/>
        <div class="err-text" id="login-err"></div>
        <button class="btn1" style="width:100%;justify-content:center;margin-top:8px" onclick="doLogin()">${t().loginBtn}</button>
        <div style="text-align:center;margin-top:12px"><span class="link" onclick="showRegister()">${t().register}</span></div>
      </div>
      <div id="reg-form" class="hidden">
        <label class="txt2" style="font-size:12px;display:block;margin-bottom:4px">${t().username}</label>
        <input class="inp" id="inp-reg" placeholder="${t().username}" onkeydown="if(event.key==='Enter')doRegister()"/>
        <div class="err-text" id="reg-err"></div>
        <button class="btn1" style="width:100%;justify-content:center;margin-top:8px" onclick="doRegister()">${t().registerBtn}</button>
        <div style="text-align:center;margin-top:12px"><span class="link" onclick="showLoginForm()">${t().login}</span></div>
      </div>
    </div>
  </div>`;
}
function showRegister(){hide('login-form');show('reg-form');$('reg-err').textContent='';}
function showLoginForm(){show('login-form');hide('reg-form');$('login-err').textContent='';}

async function doLogin(){
  const name=$('inp-user').value.trim();
  if(!name){$('login-err').textContent=t().enterName;return;}
  try{
    const doc=await db.collection('users').doc(name).get();
    if(!doc.exists){$('login-err').textContent=t().noUser;return;}
    curUser=name;localStorage.setItem('aws_quiz_user',name);
    await loadUserResults();renderMenu();
  }catch(e){$('login-err').textContent='Error: '+e.message;}
}

async function doRegister(){
  const name=$('inp-reg').value.trim();
  if(!name){$('reg-err').textContent=t().enterName;return;}
  try{
    const doc=await db.collection('users').doc(name).get();
    if(doc.exists){$('reg-err').textContent=t().userExists;return;}
    await db.collection('users').doc(name).set({createdAt:new Date().toISOString()});
    curUser=name;localStorage.setItem('aws_quiz_user',name);
    userResults={};renderMenu();
  }catch(e){$('reg-err').textContent='Error: '+e.message;}
}

function doLogout(){curUser=null;localStorage.removeItem('aws_quiz_user');userResults={};renderLogin();}

async function loadUserResults(){
  userResults={};
  try{
    const snap=await db.collection('records').where('username','==',curUser).get();
    snap.forEach(doc=>{const d=doc.data();userResults[d.setId]=d;});
  }catch(e){console.error(e);}
}

async function saveResult(setId,data){
  const docId=curUser+'_set'+setId;
  const payload={...data,username:curUser,setId};
  try{await db.collection('records').doc(docId).set(payload);}catch(e){console.error(e);}
}

async function deleteResult(setId){
  const docId=curUser+'_set'+setId;
  try{await db.collection('records').doc(docId).delete();}catch(e){console.error(e);}
  delete userResults[setId];
}

// ── MENU ──────────────────────────────────────────────────────────────────────
function goMenu(){renderMenu();}
function renderMenu(){
  showV('menu');
  let h=`<div class="container-sm"><h2 style="font-size:15px;font-weight:500;margin-bottom:12px">${t().examSet}</h2>`;
  SETS.forEach(s=>{
    const r=userResults[s.id],pct=r?Math.round(r.score/r.total*100):null;
    const done=r?`<span class="tag tag-green">${t().completed}</span>`:`<span class="tag tag-gray">${t().notStarted}</span>`;
    const sc=r?`<span style="color:${pct>=72?'#0F6E56':'#A32D2D'};font-weight:500;margin-left:6px">${t().score}: ${r.score}/${r.total} (${pct}%)</span>`:'';
    const dt=r?.date?`<div class="txt2" style="font-size:12px;margin-top:3px">📅 ${t().takenOn}: ${fmt(r.date)}</div>`:'';
    const rb=r&&r.errors.length>0?`<button class="btn-ghost" onclick="openReview(${s.id})">👁 ${t().review} (${r.errors.length})</button>`:'';
    const sb=`<button class="${r?'btn-ghost':'btn1'}" style="${r?'border-color:#378ADD;color:#378ADD':''}" onclick="startExam(${s.id})">${r?'🔄 '+t().retake:'▶ '+t().start}</button>`;
    const db2=r?`<button class="btn-ghost btn-danger" onclick="confirmDel(${s.id})">🗑 ${t().deleteRecord}</button>`:'';
    h+=`<div class="card"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <div><div style="font-weight:500;font-size:15px;margin-bottom:3px">${t().examSet} ${s.id} <span class="txt2" style="font-weight:400;font-size:12px">(${s.range})</span>${done}</div>
      <div class="txt2">50 ${t().questions} · ${t().perQ}${sc}</div>${dt}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${rb}${sb}${db2}</div></div></div>`;
  });
  h+='</div>';
  $('V-menu').innerHTML=h;
}

// ── EXAM ──────────────────────────────────────────────────────────────────────
function startExam(sid){activeSet=sid;curIdx=0;ans={};revd={};msel={};showV('exam');renderExam();}

function renderExam(){
  const qs=getQs(activeSet),tot=qs.length,q=qs[curIdx];if(!q)return;
  const multi=!!q.en.m,qid=q.id,rv=!!revd[qid],pct=Math.round((curIdx/tot)*100+(1/tot)*100);
  let oh='';
  q[lang].o.forEach((opt,i)=>{
    const ua=uAns(qid,multi),uc=ua.includes(i),ic=q.c.includes(i),sl=multi?(msel[qid]||[]).includes(i):false;
    let cls='opt-btn',icon='';
    if(rv){cls+=' revealed';if(ic&&uc){cls+=' correct';icon='<span style="margin-left:auto;color:#0F6E56;font-weight:700">✓</span>';}else if(ic){cls+=' missed';icon='<span style="margin-left:auto;color:#1D9E75;font-weight:700;opacity:.6">✓</span>';}else if(uc){cls+=' wrong';icon='<span style="margin-left:auto;color:#A32D2D;font-weight:700">✗</span>';}}
    else if(sl){cls+=' sel-multi';}
    oh+=`<button class="${cls}" onclick="optClk(${i})"><span class="opt-key">${K(i)}</span><span style="flex:1">${opt}</span>${icon}</button>`;
  });
  let mb='',eb='';
  if(multi&&!rv){const n=(msel[qid]||[]).length;mb=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span class="txt2">${n}/2 ${t().selected}</span><button class="btn1" onclick="chkMulti()" ${n<2?'style="opacity:.5;cursor:default"':''}>${t().check}</button></div>`;}
  if(rv){
    const ck=q.c.map(i=>K(i)).join(', ');
    let wo='';if(q[lang].w&&Object.keys(q[lang].w).length>0){wo=`<div class="txt2" style="font-weight:500;font-size:12px;margin-top:8px">${t().whyWrong}:</div>`;Object.entries(q[lang].w).forEach(([k,v])=>{wo+=`<div class="txt2" style="margin-bottom:2px"><strong style="font-weight:500">${k}:</strong> ${v}</div>`;});}
    eb=`<div class="explain-box"><div style="color:#0F6E56;font-weight:500;margin-bottom:4px">✓ ${t().correctAnswer}: ${ck}</div><div class="txt2"><strong style="font-weight:500">${t().whyCorrect}: </strong>${q[lang].x}</div>${wo}</div>`;
  }
  const last=curIdx===tot-1;
  const nb=last?`<button class="btn1" onclick="doSubmit()">✓ ${t().submit}</button>`:`<button class="btn1" onclick="navE(1)">${t().next} →</button>`;
  $('V-exam').innerHTML=`<div class="container">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span class="txt2">${t().examSet} ${activeSet} · ${t().progress}: ${aCnt()}/${tot}</span><span class="txt2">${curIdx+1}/${tot}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card"><div class="txt2" style="font-size:12px;margin-bottom:5px">Q${q.id}</div><div style="font-size:15px;font-weight:500;line-height:1.6">${q[lang].q}</div>${multi?`<div style="font-size:12px;color:#185FA5;font-style:italic;margin-top:6px">${t().chooseTwo}</div>`:''}</div>
    ${oh}${mb}${eb}
    <div class="nav-row"><button class="btn-ghost" onclick="navE(-1)" ${curIdx===0?'style="opacity:.4;cursor:default"':''}>← ${t().prev}</button>
    <div style="display:flex;gap:8px"><button class="btn-ghost" onclick="confirmEarly()">⚑ ${t().earlySubmit}</button>${nb}</div></div></div>`;
}
function navE(d){const n=curIdx+d;if(n<0||n>=getQs(activeSet).length)return;curIdx=n;renderExam();}
function optClk(i){const q=getQs(activeSet)[curIdx],qid=q.id;if(revd[qid])return;if(q.en.m){const s=[...(msel[qid]||[])],p=s.indexOf(i);if(p>=0)s.splice(p,1);else if(s.length<2)s.push(i);msel[qid]=s;}else{ans[qid]=i;revd[qid]=true;}renderExam();}
function chkMulti(){const q=getQs(activeSet)[curIdx],qid=q.id,s=msel[qid]||[];if(s.length<2)return;ans[qid]=s;revd[qid]=true;renderExam();}

async function doSubmit(){
  const qs=getQs(activeSet);let score=0;const errors=[];
  qs.forEach(q=>{
    const multi=!!q.en.m,qid=q.id,ua=uAns(qid,multi);
    const c=[...q.c].sort(),u=[...ua].sort();
    if(JSON.stringify(c)===JSON.stringify(u))score+=2;
    else errors.push({qid,userAns:u,correct:c});
  });
  const data={score,errors,total:qs.length*2,date:new Date().toISOString()};
  userResults[activeSet]=data;
  await saveResult(activeSet,data);
  closeModal();renderResult();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function showModal(title,desc,okLabel,danger,fn){
  $('m-title').textContent=title;$('m-desc').textContent=desc;$('m-cancel').textContent=t().cancel;
  const b=$('m-ok');b.textContent=okLabel;b.className='btn1';b.style.background=danger?'#A32D2D':'#378ADD';b.style.borderColor=danger?'#A32D2D':'#378ADD';
  modalFn=fn;b.onclick=()=>{if(modalFn)modalFn();};show('modal');
}
function closeModal(){hide('modal');modalFn=null;}
function confirmEarly(){const n=aCnt(),tot=getQs(activeSet).length;showModal(t().earlySubmitConfirm,t().earlySubmitDesc.replace('{n}',n).replace('{total}',tot),t().confirm,false,()=>doSubmit());}
function confirmDel(sid){showModal(t().deleteConfirm,t().deleteDesc,t().deleteRecord,true,async()=>{await deleteResult(sid);closeModal();renderMenu();});}

// ── RESULT ────────────────────────────────────────────────────────────────────
function renderResult(){
  showV('result');const r=userResults[activeSet];if(!r)return;
  const pct=Math.round(r.score/r.total*100),pass=pct>=72;
  const rb=r.errors.length>0?`<button class="btn-ghost" onclick="openReview(${activeSet})">👁 ${t().review} (${r.errors.length})</button>`:'';
  $('V-result').innerHTML=`<div class="container-sm"><div class="card" style="text-align:center;padding:2.5rem 2rem">
    <div style="font-size:56px;font-weight:500;color:${pass?'#1D9E75':'#A32D2D'}">${pct}%</div>
    <div style="font-size:18px;font-weight:500;margin-bottom:4px">${pass?t().passed:t().failed}</div>
    <div class="txt2">${t().passMark}</div>
    <div class="txt2" style="margin:8px 0 24px;font-size:12px">📅 ${t().takenOn}: ${fmt(r.date)}</div>
    <div style="display:flex;justify-content:center;gap:40px;margin-bottom:28px">
      <div><div style="font-size:24px;font-weight:500;color:#1D9E75">${r.score}</div><div class="txt2">${t().score}</div></div>
      <div><div style="font-size:24px;font-weight:500;color:#A32D2D">${r.errors.length*2}</div><div class="txt2">${t().wrongPts}</div></div>
      <div><div style="font-size:24px;font-weight:500">${r.total}</div><div class="txt2">${t().totalPts}</div></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${rb}
      <button class="btn1" onclick="startExam(${activeSet})">🔄 ${t().retake}</button>
      <button class="btn-ghost btn-danger" onclick="confirmDel(${activeSet})">🗑 ${t().deleteRecord}</button>
    </div></div></div>`;
}

// ── REVIEW ────────────────────────────────────────────────────────────────────
function openReview(sid){reviewSet=sid;renderReview();}
function renderReview(){
  showV('review');const r=userResults[reviewSet];
  const qs=getQs(reviewSet).filter(q=>(r?.errors||[]).some(e=>e.qid===q.id));
  let h=`<div class="container"><h2 style="font-size:18px;font-weight:500;margin-bottom:4px">${t().errorReview}</h2><p class="txt2" style="margin-bottom:24px">${t().examSet} ${reviewSet} · ${qs.length} ${t().wrong}${r?.date?' · '+fmt(r.date):''}</p>`;
  if(!qs.length)h+=`<div class="txt2" style="text-align:center;padding:3rem">${t().noErrors}</div>`;
  qs.forEach(q=>{
    const multi=!!q.en.m,err=(r?.errors||[]).find(e=>e.qid===q.id),ua=err?.userAns||[];
    let yh=ua.length===0?`<div class="sec-bg txt2" style="font-style:italic;font-size:13px">${t().unanswered}</div>`:ua.map(i=>`<div class="review-ans review-wrong"><span style="font-weight:500;color:#A32D2D;min-width:18px">${K(i)}</span><span>${q[lang].o[i]}</span><span style="margin-left:auto;font-weight:700;color:#A32D2D">✗</span></div>`).join('');
    let ch=q.c.map(i=>`<div class="review-ans review-correct"><span style="font-weight:500;color:#0F6E56;min-width:18px">${K(i)}</span><span>${q[lang].o[i]}</span><span style="margin-left:auto;font-weight:700;color:#0F6E56">✓</span></div>`).join('');
    h+=`<div class="card"><div class="txt2" style="font-size:12px;margin-bottom:6px">Q${q.id}${multi?' · '+t().chooseTwo:''}</div>
      <div style="font-size:15px;font-weight:500;line-height:1.6;margin-bottom:14px">${q[lang].q}</div>
      <div class="txt2" style="font-size:12px;font-weight:500;margin-bottom:6px">${t().yourAns}:</div>${yh}
      <div class="txt2" style="font-size:12px;font-weight:500;margin:12px 0 6px">${t().correctAns}:</div>${ch}
      <div class="review-hint"><strong>${t().whyCorrect}: </strong>${q[lang].x}</div></div>`;
  });
  h+='</div>';$('V-review').innerHTML=h;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(async function init(){
  const saved=localStorage.getItem('aws_quiz_user');
  if(saved){
    try{
      const doc=await db.collection('users').doc(saved).get();
      if(doc.exists){curUser=saved;await loadUserResults();renderMenu();return;}
    }catch(e){console.error(e);}
  }
  renderLogin();
})();
</script>
</body>
